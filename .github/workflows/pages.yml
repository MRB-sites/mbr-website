# Client preview on GitHub Pages: https://mrb-sites.github.io/mbr-website/
# Builds on every push to main. The preview is hidden from search engines (PUBLIC_NOINDEX).
# Forms do not submit here (Netlify Forms only work on Netlify) – they show the error screen with the email address.
#
# The built site is pushed to the gh-pages branch, and Pages serves that branch
# (Settings → Pages → Source: Deploy from a branch → gh-pages / root).
# actions/deploy-pages kept timing out for this repo, so the branch route is used instead.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://mrb-sites.github.io
          PUBLIC_BASE_PATH: /mbr-website
          PUBLIC_NOINDEX: 'true'
      - name: Push dist to gh-pages
        run: |
          cd dist
          touch .nojekyll # serve the _astro/ folder as-is (Jekyll would drop underscore folders)
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
