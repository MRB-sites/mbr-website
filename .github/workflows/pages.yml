# Client preview on GitHub Pages: https://mrb-sites.github.io/mbr-website/
# Builds on every push to main. The preview is hidden from search engines (PUBLIC_NOINDEX).
# Forms do not submit here (Netlify Forms only work on Netlify) – they show the error screen with the email address.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://mrb-sites.github.io
          PUBLIC_BASE_PATH: /mbr-website
          PUBLIC_NOINDEX: 'true'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
